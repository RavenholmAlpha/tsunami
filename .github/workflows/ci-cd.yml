name: TSUNAMI CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Stage 1: Quality Gate ────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache: true

    - name: Verify go.mod is tidy
      run: |
        go mod tidy
        if ! git diff --quiet go.mod go.sum; then
          echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit."
          git diff go.mod go.sum
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: golangci-lint
      run: |
        # Pin the linter: @latest switched major versions before and silently
        # changed which findings fail the build. v1.64.8 is the last v1 release
        # and matches the v1-style .golangci.yml in this repository.
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
        golangci-lint run --timeout=5m ./...

    - name: Shellcheck
      run: |
        shellcheck -x scripts/install.sh scripts/install-node.sh
        shellcheck -x build/package.sh build/smoke.sh build/checksums.sh build/targets.sh \n          build/openwrt/tsunami.init tests/package_script_test.sh tests/openwrt_init_test.sh

  # ── Stage 2: Test ────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache: true

    - name: Download Dependencies
      run: go mod download

    - name: Unit Tests
      run: go test -v -count=1 -race -timeout 5m -coverprofile=coverage.out ./pkg/...

    - name: Integration Tests
      run: |
        go test -v -count=1 -timeout 5m ./tests/...
        bash tests/install_script_test.sh
        bash tests/install_node_script_test.sh
        bash tests/openwrt_init_test.sh
        bash tests/package_script_test.sh

    - name: Verify Build
      run: |
        go build -o /dev/null ./cmd/tsunami-server/
        go build -o /dev/null ./cmd/tsunami-client/
        go build -o /dev/null ./cmd/tsunami-node/

    - name: Upload Coverage
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: codecov/codecov-action@v4
      with:
        files: coverage.out
        fail_ci_if_error: false
      continue-on-error: true

  # ── Stage 3: Security ───────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache: true

    - name: Govulncheck
      continue-on-error: true  # Advisory — stdlib vulns are fixed by building with latest Go
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  # ── Stage 4: Package every target ───────────────────────────────────
  # One job per target. Each job builds, packages and smoke-tests its own
  # archive, so a target that cannot be built or run blocks the release.
  # Windows targets build on a Windows runner so their .exe files are the
  # ones that get executed by the smoke test.
  package:
    name: Package ${{ matrix.target }}
    needs: [ test ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-latest
          - target: linux-386
            runner: ubuntu-latest
          - target: linux-armv7
            runner: ubuntu-latest
          - target: windows-amd64
            runner: windows-latest
          - target: windows-386
            runner: windows-latest
          - target: darwin-amd64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: ubuntu-latest
          - target: openwrt-x86_64
            runner: ubuntu-latest
          - target: openwrt-x86
            runner: ubuntu-latest
          - target: openwrt-aarch64
            runner: ubuntu-latest
          - target: openwrt-armv7
            runner: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache: true

    # Lets the smoke test run arm and arm64 binaries on the x86 runner.
    - name: Install QEMU user emulation
      if: runner.os == 'Linux' && !startsWith(matrix.target, 'darwin') && (contains(matrix.target, 'arm') || contains(matrix.target, 'aarch64'))
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static

    # Tag builds use the tag. Every other build gets a throwaway
    # pre-release version so the same scripts run on pull requests.
    - name: Resolve version
      id: version
      shell: bash
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          version="${GITHUB_REF_NAME}"
        else
          version="v0.0.0-dev.${GITHUB_SHA::8}"
        fi
        echo "value=${version}" >> "$GITHUB_OUTPUT"

    - name: Build and package
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.value }}
        TARGET: ${{ matrix.target }}
      run: bash build/package.sh -v "$VERSION" -t "$TARGET" -o dist

    - name: Smoke test
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.value }}
        TARGET: ${{ matrix.target }}
      run: bash build/smoke.sh -t "$TARGET" -v "$VERSION" dist/tsunami-"$VERSION"-"$TARGET".*

    - name: Upload archive
      uses: actions/upload-artifact@v4
      with:
        name: package-${{ matrix.target }}
        path: dist/*
        if-no-files-found: error
        retention-days: 14

  # ── Stage 5: Publish the GitHub release (tags only) ──────────────────
  release:
    name: Release
    needs: [ test, security, package ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: package-*
        merge-multiple: true

    - name: Generate checksums
      run: |
        bash build/checksums.sh dist
        cat dist/checksums.sha256

    - name: Verify release assets
      run: |
        source build/targets.sh
        missing=0
        for target in $ALL_TARGETS; do
          if ! ls dist/tsunami-"${GITHUB_REF_NAME}"-"${target}".* > /dev/null 2>&1; then
            echo "::error::missing archive for ${target}"
            missing=1
          fi
        done
        [ "$missing" -eq 0 ] || exit 1
        (cd dist && sha256sum -c checksums.sha256)
        ls -l dist

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        fail_on_unmatched_files: true
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
